<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>Akshay Medicose</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-owner="0" data-lang="en">
  <div class="sticky-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">AM</div>
        <div>
          <div class="brand-name">Akshay Medicose</div>
          <div class="loc-badge" id="locBadge">Ujjain</div>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="pill-btn" id="ownerBtn">Counter Mode</button>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" id="langEn" class="on">EN</button>
          <button type="button" id="langHi">HI</button>
        </div>
        <button type="button" class="pill-btn primary" id="apkBtn">Get Mobile App</button>
      </div>
    </header>
    <nav class="modnav" id="modnav" aria-label="Modules"></nav>
  </div>
  <main id="app"></main>
  <div id="modalRoot"></div>
  <div id="toast" role="status"></div>
  <script src="js/qrcode.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/receipt.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/storeEngine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
